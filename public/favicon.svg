<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Rounded Apple / Android App Icon Background -->
  <rect width="180" height="180" rx="40" fill="#0A0A0C" />
  
  <!-- Subtle Ambient Glow -->
  <radialGradient id="frostGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7A8DFF" stop-opacity="0.35" />
    <stop offset="100%" stop-color="#7A8DFF" stop-opacity="0" />
  </radialGradient>
  <circle cx="90" cy="90" r="70" fill="url(#frostGlow)" />

  <!-- Outer Hexagonal Shield / Monolith Arc -->
  <path
    d="M 90 24 L 148 58 L 148 122 L 90 156 L 32 122 L 32 58 Z"
    stroke="#FFFFFF"
    stroke-width="6.5"
    stroke-linejoin="round"
    fill="#0F0F14"
  />

  <!-- Top Diamond Star / Frost Apex -->
  <path
    d="M 90 44 L 96 56 L 90 68 L 84 56 Z"
    fill="#7A8DFF"
  />

  <!-- Inner Geometric Winter Arc "W" -->
  <path
    d="M 54 68 L 78 120 L 90 90 L 102 120 L 126 68"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Arc Base Bar -->
  <path
    d="M 72 132 L 108 132"
    stroke="#7A8DFF"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>